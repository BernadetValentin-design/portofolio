<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentin Bernadet</title>
    <meta name="description"
        content="Portfolio of Valentin Bernadet, AI & Software Engineering student at ESILV. Looking for a 6-month internship from February 2027.">

    <!-- Apply the saved theme before the page paints, to avoid a flash -->
    <script>
        try {
            const theme = localStorage.getItem('vb-theme');
            if (theme) document.documentElement.dataset.theme = theme;
        } catch (e) { }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ============ HOME : the search page ============ -->
    <div id="home" class="view view-home">

        <header class="home-top">
            <a href="#projects" class="top-link" data-i18n="nav_projects">Projects</a>
            <a href="#about" class="top-link" data-i18n="nav_contact">Contact</a>
            <button type="button" class="top-link theme-toggle" data-theme-toggle>Dark theme</button>
            <a href="#all" class="avatar" aria-label="Valentin Bernadet"><img src="content/photo%20cv.jpg" alt=""></a>
        </header>

        <main class="home-main">
            <h1 class="logo logo-xl" aria-label="Valentin">
                <span>V</span><span>a</span><span>l</span><span>e</span><span>n</span><span>t</span><span>i</span><span>n</span>
            </h1>

            <form class="search search-home" id="home-form" role="search" autocomplete="off">
                <i class="fas fa-magnifying-glass search-icon"></i>
                <input type="text" id="home-input" data-i18n-attr="aria-label:search_label" placeholder="">
                <kbd class="search-kbd">/</kbd>
                <ul class="suggestions" id="suggestions" role="listbox"></ul>
            </form>

            <div class="home-btns">
                <button type="submit" form="home-form" class="btn" data-i18n="btn_search">Valentin Search</button>
                <button type="button" class="btn" id="lucky" data-i18n="btn_lucky">I'm Feeling Lucky</button>
            </div>

            <p class="home-note" data-i18n-html="note"></p>
        </main>

        <footer class="site-foot">
            <span class="foot-langs">
                <span data-i18n="offered_in">Valentin is offered in:</span>
                <span class="lang-links" data-lang-links></span>
            </span>
            <span class="foot-links">
                <a href="https://www.linkedin.com/in/valentin-bernadet" target="_blank" rel="noopener">LinkedIn</a>
                <a href="https://github.com/BernadetValentin-design" target="_blank" rel="noopener">GitHub</a>
                <a href="mailto:valentin.bernadet@edu.devinci.fr" data-i18n="c_email">Email</a>
            </span>
        </footer>
    </div>

    <!-- ============ RESULTS : the portfolio ============ -->
    <div id="results" class="view view-results" hidden>

        <header class="res-top">
            <div class="res-bar">
                <a href="#" class="logo logo-sm" data-i18n-attr="aria-label:back_home">
                    <span>V</span><span>a</span><span>l</span><span>e</span><span>n</span><span>t</span><span>i</span><span>n</span>
                </a>
                <form class="search search-res" id="res-form" role="search" autocomplete="off">
                    <input type="text" id="res-input" data-i18n-attr="aria-label:search_label" value="valentin bernadet">
                    <button type="submit" data-i18n-attr="aria-label:search_go"><i class="fas fa-magnifying-glass"></i></button>
                </form>
                <div class="res-tools">
                    <span class="lang-switch" role="group" data-i18n-attr="aria-label:lang_group" data-lang-switch></span>
                    <button type="button" class="icon-btn" data-theme-toggle data-icon-only></button>
                    <a href="content/Bernadet_Valentin_Resume.pdf" download class="btn btn-sm"><i class="fas fa-download"></i> CV</a>
                </div>
            </div>

            <nav class="tabs" aria-label="Sections">
                <a href="#all" data-tab="all" data-i18n="tab_all">All</a>
                <a href="#projects" data-tab="projects" data-i18n="tab_projects">Projects</a>
                <a href="#experience" data-tab="experience" data-i18n="tab_experience">Experience</a>
                <a href="#skills" data-tab="skills" data-i18n="tab_skills">Skills</a>
                <a href="#about" data-tab="about" data-i18n="tab_about">About</a>
                <span class="tab-ink" aria-hidden="true"></span>
            </nav>
        </header>

        <main class="res-main">
            <p class="stats" id="stats"></p>
            <section class="panel" data-panel="all" hidden></section>
            <section class="panel" data-panel="projects" hidden></section>
            <section class="panel" data-panel="experience" hidden></section>
            <section class="panel" data-panel="skills" hidden></section>
            <section class="panel" data-panel="about" hidden></section>
            <section class="panel" data-panel="search" hidden></section>
            <nav class="pager" id="pager" aria-label="Pages"></nav>
        </main>

        <footer class="site-foot">
            <span>© 2026 Valentin Bernadet</span>
            <span class="foot-links">
                <a href="https://www.linkedin.com/in/valentin-bernadet" target="_blank" rel="noopener">LinkedIn</a>
                <a href="https://github.com/BernadetValentin-design" target="_blank" rel="noopener">GitHub</a>
                <a href="mailto:valentin.bernadet@edu.devinci.fr" data-i18n="c_email">Email</a>
            </span>
        </footer>
    </div>

    <!-- ============ Project page (slides in from the right) ============ -->
    <dialog class="drawer" id="drawer" aria-labelledby="drawer-title">
        <div class="drawer-body" id="drawer-body"></div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="content.js"></script>
    <script src="script.js"></script>
</body>

</html>
